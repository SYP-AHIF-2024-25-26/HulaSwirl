<nav id="navbar" #navbar>
  <img src="assets/images/InconV2png.png" id="logo" alt="Logo">
  <button id="menu-toggle" (click)="toggleMenu()">☰</button>
  <div id="nav-page-container" [ngClass]="{open: menuOpen}">
    <a class="bigLink" routerLink="home"
       >
      Home
    </a>
    <a class="link"
       *ngIf="userService.getAdminStatus()"
       routerLink="drinks"
       routerLinkActive="active">
      Drinks
    </a>
    <a class="link"
       *ngIf="userService.getAdminStatus()"
       routerLink="ingredients"
       routerLinkActive="active">
      Ingredients
    </a>

    <a class="link"
       *ngIf="userService.getAdminStatus()"
       routerLink="statistics"
       routerLinkActive="active">
      Statistics
    </a>
    <a class="link"
       *ngIf="userService.getAdminStatus() || userService.getOperatorStatus()"
       routerLink="orders"
       routerLinkActive="active">
      Orders
    </a>

    <div id="mobile-user-section">
      <button id="account-toggle" (click)="toggleAccountMenu()">👤</button>
      <div id="account-details" *ngIf="accountMenuOpen">
        <ng-container *ngIf="userService.isLoggedIn(); else mobileLogin">
          <span>{{ userService.username() || 'N/A' }}</span>
          <button class="logout-btn" (click)="userService.logout(); closeMenus()">Logout</button>
        </ng-container>
        <ng-template #mobileLogin>
          <a class="login-link" (click)="openLoginModal(); closeMenus()">Login</a>
        </ng-template>
      </div>
    </div>
  </div>
  <div class="spacer"></div>


  <div id="user-section">
    <ng-container *ngIf="userService.isLoggedIn(); else loginRegister">
      <span>🦩</span>
      <a id="user-info"> {{ userService.username() || 'N/A' }}</a>
      <button id="logout-btn" (click)="userService.logout()">Logout</button>
    </ng-container>
    <ng-template #loginRegister>
      <a class="login-link" (click)="openLoginModal()">Login</a>
    </ng-template>
  </div>

</nav>

<app-background-leaves>
  <router-outlet></router-outlet>
  <app-order-custom-drink-modal id="order-custom-drink-modal" [hidden]="displayedModal() != ModalType.CustomOrder"></app-order-custom-drink-modal>
  <app-order-drink-modal id="order-drink-modal" [hidden]="displayedModal() != ModalType.Order"></app-order-drink-modal>
  <app-drink-modal id="drink-modal" [hidden]="displayedModal()!=ModalType.AddDrink && displayedModal()!=ModalType.EditDrink"></app-drink-modal>
  <app-user-modal id="user-modal" [hidden]="displayedModal()!=ModalType.User"></app-user-modal>
  <app-status-modal id="status-modal" [hidden]="displayedModal()!=ModalType.Status"></app-status-modal>
</app-background-leaves>

<app-loading-spinner></app-loading-spinner>
