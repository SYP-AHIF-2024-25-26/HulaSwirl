<div class="search-wrapper">
  <h2>Search for users</h2>
  <input
    id="user-search"
    class="form-input"
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Type to filter by name or role"
    autocomplete="off"
  />
</div>
<div class="users container">
  @if (filteredUsers().length === 0) {
    <p>Couldn't find any user</p>
  } @else {
    @for (user of filteredUsers(); track $index){
      <div class="user-card" (click)="viewProfile(user)">
        <div class="avatar">{{initials(user)}}</div>
        <div class="details">
          <div class="name-row">
            <h3>{{user.username}}</h3>
            <h5 class="badge {{user.role}}">{{user.role.toUpperCase()}}</h5>
          </div>
          <p class="meta">
            Last seen: {{ getLastSeenText(user.lastLogin) }}
          </p>
        </div>
        @if (user.status){
          <p class="error field-error">{{user.status}}</p>
        }
      </div>
    }
  }
</div>
