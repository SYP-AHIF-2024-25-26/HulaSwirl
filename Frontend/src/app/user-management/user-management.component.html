<div class="users container">
  <div class="user-card" *ngFor="let user of users()">
    <div class="card-header">
      <div class="avatar">{{initials(user)}}</div>
      <div class="details">
        <div class="name-row">
          <h3>{{user.username}}</h3>
          <h5 class="badge {{user.role}}">{{user.role.toUpperCase()}}</h5>
        </div>
        <p class="meta">Created: {{user.createdAt | date:'MMM d, y, HH:mm'}}</p>
        <p class="meta">Last login: {{ user.lastLogin ? (user.lastLogin | date:'MMM d, y, HH:mm') : 'Never' }}</p>
      </div>
    </div>
    <div class="actions">
      <button class="button" (click)="viewProfile(user)">View Profile</button>
    </div>
    <p *ngIf="user.status" class="error field-error">{{user.status}}</p>
  </div>
</div>
