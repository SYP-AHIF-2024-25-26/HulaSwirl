<div class="background-edges">
  <div class="edge edge-left" [class.lowEnd]="lowEndDetected()"></div>

  <div class="content">
    <ng-content></ng-content>
  </div>

  <div class="edge edge-right" [class.lowEnd]="lowEndDetected()"></div>

    <section class="ppt-footer-wrapper">
        <div class="ppt-stage-outer">
            <div class="ppt-stage-inner" role="img">
                <img class="layer img1" src="assets/images/img1.png" alt="" />
                <img class="layer img2" src="assets/images/img2.png" alt="" />

                <img class="layer img3" src="assets/images/img3.png" alt="" />
                <img class="layer img4" src="assets/images/img4.png" alt="" />
                <img class="layer img5" src="assets/images/img5.png" alt="" />

                <img class="layer img6" src="assets/images/img6.png" alt="" />
                <img class="layer img7" src="assets/images/img7.png" alt="" />
            </div>
        </div>
        <footer class="footer-bar">
            <div class="footer-inner">
                <div class="brand">
                    <div class="brand-title">🍹 HulaSwirl</div>
                    <div class="brand-sub">Fresh drinks. Tropical vibes.</div>
                </div>
                <div class="about">
                    <div class="section-title">About</div>
                    <p>
                        HulaMix ist ein kleiner Drink-Mixer für Rezepte, Zutaten und eigene Kreationen.
                        Keine Werbung, kein Bullshit. Nur Drinks.
                    </p>
                </div>
                <div class="social">
                    <a
                            class="icon-link"
                            href="https://github.com/SYP-AHIF-2024-25-26/HulaSwirl/"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="GitHub Repository"
                            title="GitHub"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                    d="M12 .5C5.73.5.75 5.48.75 11.75c0 4.86 3.16 8.98 7.55 10.43.55.1.75-.24.75-.53v-1.9c-3.07.67-3.72-1.3-3.72-1.3-.5-1.26-1.22-1.6-1.22-1.6-1-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.68 2.57 1.2 3.2.92.1-.71.38-1.2.69-1.48-2.45-.28-5.02-1.22-5.02-5.45 0-1.2.43-2.18 1.13-2.95-.11-.28-.49-1.4.11-2.92 0 0 .92-.29 3.02 1.13.88-.24 1.82-.36 2.76-.36s1.88.12 2.76.36c2.1-1.42 3.02-1.13 3.02-1.13.6 1.52.22 2.64.11 2.92.7.77 1.13 1.75 1.13 2.95 0 4.24-2.58 5.17-5.04 5.44.39.34.74 1 .74 2.02v3c0 .29.2.64.76.53 4.39-1.45 7.55-5.57 7.55-10.43C23.25 5.48 18.27.5 12 .5z"
                            />
                        </svg>
                    </a>
                </div>
            </div>
            <div class="legal">
                <span>© {{ year }} HulaSwirl</span>
                <span class="dot">•</span>
                <a routerLink="/impressum">Impressum</a>
                <span class="dot">•</span>
                <a routerLink="/datenschutz">Datenschutz</a>
            </div>
        </footer>

    </section>
</div>
