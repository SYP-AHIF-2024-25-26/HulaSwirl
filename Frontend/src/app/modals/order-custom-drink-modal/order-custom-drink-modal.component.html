<app-modal-shell
  [config]="{ title: 'Configure your own Drink', size: 'large', closeOnBackdrop: true }"
  (closed)="closeModal()"
>
  <ng-template #appModalBody>
    <div id="ingredient-list">
      <div class="ai-generate">
        <textarea
          id="prompt"
          [(ngModel)]="prompt"
          rows="3"
          placeholder="Describe your perfect drink..."
        ></textarea>

        <button
          type="button"
          (click)="aiGenerate()"
          [disabled]="aiGenerating()"
        >
          AI-Generate
        </button>
      </div>
      @for(ingredient of availableIngredients(); track $index){
        <div class="order-ingredient" [class.selected]="isSelected(ingredient.ingredientName)" (click)="toggleIngredient(ingredient, $event.target!)">
          <input type="checkbox" class="ingredient-check" tabindex="0" [checked]="isSelected(ingredient.ingredientName)">
          <div class="order-ingredient-details">
            <div class="ingredient-properties">
              <span class="order-ingredient-name">{{ ingredient.ingredientName }}</span>
              <input min="1" max="500" type="number" class="order-ingredient-amount form-input" (input)="toggleIngredient(ingredient, $event.target!)" (click)="toggleIngredient(ingredient, $event.target!, true)" [attr.tabindex]="$index + 1" [ngModel]="getAmount(ingredient.ingredientName)" (ngModelChange)="updateAmount(ingredient.ingredientName, $event)">
              <span class="order-ingredient-unit">ml</span>
            </div>
            <p class="error field-error">{{ getStatus(ingredient.ingredientName) }}</p>
          </div>
        </div>
      } @empty {
        <div id="no-ingredients">
          <span class="order-ingredient-name">No ingredients available</span>
        </div>
      }
    </div>
  </ng-template>

  <ng-template #appModalFooter>
    @if(globalError()) {
      <p class="error global-error">{{ globalError() }}</p>
    }
  </ng-template>

  <ng-template #appModalHeader>
    <div class="header-row">
      <div>
        <p class="subtitle">Customize to your taste</p>
        <h2>Configure your own Drink</h2>
      </div>
    </div>
  </ng-template>

  <ng-template #appModalButtons>
    <div class="order-buttons">
      <button class="button cancel-btn" (click)="closeModal()">Cancel</button>
      <button class="button submit-btn" (click)="submitOrder()">Order</button>
    </div>
  </ng-template>
</app-modal-shell>
