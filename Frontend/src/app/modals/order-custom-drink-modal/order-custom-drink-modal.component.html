<app-generic-modal [title]="title()" (closed)="closeModal()">
  <div modal-body id="custom-drink-modal">
    <!-- API Key expired :(
    <div class="ai-generate">
      <textarea id="prompt"
                [(ngModel)]="prompt"
                rows="3"
                placeholder="Describe your perfect drink..."></textarea>

      <button type="button"
              (click)="aiGenerate()"
              [disabled]="aiGenerating()">
        AI-Generate
      </button>
    </div>
    -->
    <div id="ingredient-list" aria-label="Ingredients">
      @for(ingredient of availableIngredients(); track $index){
        <div
          class="ingredient-row"
          [class.active]="getAmount(ingredient.ingredientName) > 0"
          [class.has-error]="!!getStatus(ingredient.ingredientName)"
        >
          <div class="ingredient-main">
            <div class="ingredient-name">{{ ingredient.ingredientName }}</div>
            @if(getStatus(ingredient.ingredientName)) {
              <div class="ingredient-status error" [id]="'ingredient-error-' + $index">{{ getStatus(ingredient.ingredientName) }}</div>
            }
          </div>

          <div class="stepper" role="group" [attr.aria-label]="ingredient.ingredientName + ' amount'">
            <button
              type="button"
              class="stepper-btn"
              (click)="decrement(ingredient.ingredientName)"
              [disabled]="getAmount(ingredient.ingredientName) === 0"
              aria-label="Decrease by 10 milliliters"
            >
              –
            </button>

            <input
              type="number"
              class="stepper-input form-input"
              [attr.aria-describedby]="getStatus(ingredient.ingredientName) ? ('ingredient-error-' + $index) : null"
              [min]="0"
              [max]="maxAmount"
              [step]="step"
              [ngModel]="getAmount(ingredient.ingredientName)"
              (ngModelChange)="updateAmount(ingredient.ingredientName, $event)"
              (keydown)="onAmountKeyDown(ingredient.ingredientName, $event)"
              inputmode="numeric"
            />

            <button
              type="button"
              class="stepper-btn"
              (click)="increment(ingredient.ingredientName)"
              [disabled]="getAmount(ingredient.ingredientName) >= maxAmount"
              aria-label="Increase by 10 milliliters"
            >
              +
            </button>
          </div>
        </div>
      } @empty {
        <div id="no-ingredients">
          <span class="order-ingredient-name">No ingredients available</span>
        </div>
      }
    </div>

    <div id="total-order-amount" [class.is-zero]="getTotalAmount() === 0">
      <span class="total-label">Total</span>
      <span class="total-value">{{ getTotalAmount() }} ml</span>
    </div>

    @if(globalError()) {
      <p class="error global-error">{{ globalError() }}</p>
    }

    <div modal-buttons class="order-buttons">
      <button class="button cancel-btn" type="button" (click)="closeModal()">Cancel</button>
      <button class="button submit-btn" type="button" (click)="submitOrder()" [disabled]="!canSubmit">Order</button>
    </div>
  </div>
</app-generic-modal>
