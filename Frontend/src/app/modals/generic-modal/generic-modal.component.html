<ng-template #body>
  <ng-content select="[modal-body]"></ng-content>
</ng-template>

<ng-template #footer>
  <div class="modal-buttons">
    <ng-content select="[modal-buttons]"></ng-content>
  </div>
</ng-template>

<app-modal [config]="config" [bodyTemplate]="body" [footerTemplate]="footer" (closed)="close()"></app-modal>
