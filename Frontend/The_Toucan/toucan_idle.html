<title>Toucan idle (PPT morph → CSS)</title>
<style>
:root{
  --duration:20s;
  --loop:infinite;
}
body{
  margin:0;
  display:grid;
  place-items:center;
  background:#ffc3c3;
  min-height:100vh;
}
#stage{
  position:relative;
  width:1280px;
  height:720px;
  background:transparent;
  overflow:visible;
}
.piece{
  position:absolute;
  left:0;
  top:0;
  transform-origin:center center;
  will-change:transform,left,top,width,height,opacity;
}
.piece svg{
  width:100%;
  height:100%;
  display:block;
}
